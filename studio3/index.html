<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberty Library</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">

    <!-- Type Animation JS Library -->
    <script src="https://unpkg.com/typeit@8.8.7/dist/index.umd.js"></script>

    <!-- Scroll animate library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- My JS -->
     <script src="script.js" defer></script>

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

</head>
<body>
    <div id="container">

        <header class="scene">
            <h1 id="text1"></h1>
            <p>[Scroll down]</p>
        </header>

        <section>
            <div class="scene" id="scene1">
                <div data-aos="fade-up" class="gif">
                    <img src="images/tooth.gif" alt="teeth">
                </div>
                <p data-aos="zoom-in">like losing all my teeth...</p>
            </div>

            <div class="scene" id="scene2">
                <div data-aos="fade-up" class="gif">
                    <img src="images/eye.gif" alt="eye">
                </div>
                <p data-aos="zoom-in">or being watched.. </p>
            </div>

            <div class="scene" id="scene3">
                <div data-aos="fade-up" class="gif">
                    <img src="images/chase.gif" alt="chased">
                </div>
                <p data-aos="zoom-in">or even being chased..</p>
            </div>            
        </section>

        <footer>
            <p>Made with <a href="https://michalsnik.github.io/aos/">AOS</a> and <a href="https://michalsnik.github.io/aos/">TypeIt</a></p>
            
            
        </footer>


    </div>
</body>
</html>
