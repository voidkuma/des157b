<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week of Cat Photos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois&family=Shadows+Into+Light&family=Spectral+SC:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

</head>
<body>
    <div id="container">

        <header><img src="images/catIcon.png" alt="cat icon">A Week Of Cat Photos</header>
        <main>
            <section id="dateData">
                <div class="pagination-container">
                    <button class="arrow left">&lt;</button>
                    
                    <div class="indicator-group">
                        <div class="square active"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                        <div class="square"></div>
                    </div>

                    <button class="arrow right">&gt;</button>
                </div>
                <h2>Monday <br> 9 Photos Taken,</h2>
                <p>[Notes]</p>
                <p>They were cute as always. No notes here, except for love n kisses. Muahahahha!</p>
            </section>

            <div id="photoGif-container">
                <div id="gif"><img src="images/cat.gif"></div>
                <section id="polaroid">
                    <div id="catIMG"></div>
                    <h2>*Babies enjoying the sun*</h2>

                </section>
            </div>



        </main>

    </div>
</body>
</html>
